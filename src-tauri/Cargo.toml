[package]
name = "grain-studio"
version = "1.0.0"
description = "Local photo studio with film presets"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tauri-plugin-drag = "2.1.1"
windows = { version = "0.61", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
